# Netlify publiceert enkel de map "site". Er is geen build-stap nodig.
[build]
  publish = "site"
  command = ""

# Mooie adressen zonder .html blijven werken (bv. bceeklo.be/uitslagen)
[[redirects]]
  from = "/uitslagen"
  to = "/uitslagen.html"
  status = 200

# Kleine functie achter de knop op bceeklo.be/verwerk (start de uitslagen-robot op GitHub)
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/verwerk"
  to = "/verwerk.html"
  status = 200

# Oude testadres van de ledenzone
[[redirects]]
  from = "/ledenzone_test/*"
  to = "/ledenzone/:splat"
  status = 301
[[redirects]]
  from = "/ledenzone_test"
  to = "/ledenzone/"
  status = 301
